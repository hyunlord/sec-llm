# Repository-wide pip configuration.
#
# Rule 1 for this project: no source compilation on the training host. On GB10
# the GPU and the host share one physical memory pool, so a parallel build can
# exhaust it and take the machine down -- which is exactly what happened on
# 2026-09-18 (see docs/hardware-notes.md).
#
# only-binary = :all: makes pip refuse a source distribution at resolution time
# instead of starting a compile. Activate with:
#     export PIP_CONFIG_FILE=$PWD/pip.conf
# or rely on PIP_ONLY_BINARY=:all:, which the Makefile exports.
[install]
only-binary = :all:

[global]
no-build-isolation = false
